name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1" # Mondays at 3 AM
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for base image updates
        id: check_base
        run: |
          docker pull caddy:builder
          docker pull caddy:latest
          BUILDER_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' caddy:builder)
          LATEST_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' caddy:latest)
          echo "CACHE_KEY=${BUILDER_DIGEST}-${LATEST_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate image tag
        id: vars
        run: echo "TAG=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-caddy-${{ steps.check_base.outputs.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-buildx-caddy-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: Dockerfile
          platforms: linux/amd64,linux/arm64/v8 # check the arm64vX because it needs to be specific
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/caddy:latest
            ghcr.io/${{ github.repository_owner }}/caddy:${{ steps.vars.outputs.TAG }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
